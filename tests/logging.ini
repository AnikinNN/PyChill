[formatters]
keys = default

[handlers]
keys = console

[loggers]
keys = root, pychill

[logger_root]
level = INFO
formatter = default
handlers = console
qualname = root

[logger_pychill]
level = DEBUG
formatter = default
handlers = console
qualname = pychill
propagate = 0

[handler_console]
class = logging.StreamHandler
formatter = default
args = tuple()

[formatter_default]
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
class = logging.Formatter
