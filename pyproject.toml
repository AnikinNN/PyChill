[project]
name = "pychill"
version = "0.1.0"
description = "Chill a little bit while standing in a queue..."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11.7",
    "redis>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[tool.pytest.ini_options]
addopts = [
    "--asyncio-mode=auto",
]
